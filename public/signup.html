<!doctype html>

<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Laps | Create an Account</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />

    <!-- PNG Favicons -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-32x32.png"
    />

    <!-- Apple -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />

    <!-- Android -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/favicon/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/favicon/android-chrome-512x512.png"
    />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/reicon@latest/cdn/reicon.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        background: #09090b;
      }
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
    <style>
      /* Hide scrollbar, keep scrolling */
      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      body::-webkit-scrollbar {
        display: none;
      }
      #toggleSignupPassword,
      #toggleSignupConfirmPassword,
      #toggleSigninPassword,
      #toggleResetPassword,
      #toggleResetConfirmPassword,
      #toggleSignupPassword svg,
      #toggleSignupConfirmPassword svg,
      #toggleSigninPassword svg,
      #toggleResetPassword svg,
      #toggleResetConfirmPassword svg {
        transition: none !important;
        animation: none !important;
      }
    </style>
  </head>

  <body class="h-screen overflow-hidden bg-[#09090b] text-white">
    <div
      id="pageTransition"
      class="fixed inset-0 z-[99999] flex items-center justify-center bg-[#09090b] opacity-0 pointer-events-none transition-opacity duration-700 ease-out"
    >
      <div
        id="pageTransitionText"
        class="text-[11px] uppercase tracking-[0.25em] text-white/40"
      >
        Loading...
      </div>
    </div>
    <main
      id="pageContent"
      class="min-h-screen flex flex-col lg:flex-row opacity-0 translate-y-2 transition-all duration-700 ease-out"
    >
      <!-- LEFT: SIGN UP -->

      <section
        class="relative w-full lg:w-[58%] min-h-screen flex items-center justify-center px-5 py-8 sm:px-8 lg:px-10 overflow-y-auto lg:overflow-hidden"
      >
        <!-- Compact Sign Up Form -->
        <div class="w-full max-w-[420px] mt-0 sm:mt-2 lg:mt-4 pb-16 lg:pb-0">
          <!-- Logo -->
          <div class="flex justify-center mb-5 sm:mb-6">
            <img
              src="/branding/lapslogobig.png"
              alt="Laps"
              class="h-6 sm:h-7 w-auto object-contain"
            />
          </div>

          <!-- Heading -->
          <div class="mb-4 sm:mb-5">
            <h1
              class="text-[20px] sm:text-[21px] lg:text-[22px] text-white font-semibold tracking-tight text-center"
            >
              Create your laps account.
            </h1>

            <p
              class="text-[11px] sm:text-xs text-white/50 text-center mt-1.5 sm:mt-2"
            >
              Get started with your free account.
            </p>
          </div>

          <!-- FORM -->
          <form id="signupForm" class="space-y-3.5 sm:space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
              <!-- Full Name -->
              <div>
                <label
                  for="signupName"
                  class="block mb-1.5 text-[12px] sm:text-[13px] lg:text-[14px] font-medium text-white"
                >
                  Full name
                </label>

                <input
                  type="text"
                  id="signupName"
                  name="name"
                  placeholder="John Doe"
                  autocomplete="name"
                  class="w-full h-10 sm:h-9 px-3 rounded-[9px] sm:rounded-lg border border-neutral-800 bg-transparent text-[13px] sm:text-sm text-white placeholder-neutral-500/80 outline-none transition focus:border-neutral-500"
                />
              </div>

              <!-- Email -->
              <div>
                <label
                  for="signupEmail"
                  class="block mb-1.5 text-[12px] sm:text-[13px] lg:text-[14px] font-medium text-white"
                >
                  Email
                </label>

                <input
                  type="email"
                  id="signupEmail"
                  name="email"
                  placeholder="johndoe@email.com"
                  autocomplete="email"
                  class="w-full h-10 sm:h-9 px-3 rounded-[9px] sm:rounded-lg border border-neutral-800 bg-transparent text-[13px] sm:text-sm text-white placeholder-neutral-500/80 outline-none transition focus:border-neutral-500"
                />
              </div>

              <!-- Password -->
              <div>
                <label
                  for="signupPassword"
                  class="block mb-1.5 text-[12px] sm:text-[13px] lg:text-[14px] font-medium text-white"
                >
                  Password
                </label>

                <div class="relative">
                  <input
                    type="password"
                    id="signupPassword"
                    name="password"
                    placeholder="Create password"
                    autocomplete="new-password"
                    class="w-full h-10 sm:h-9 pl-3 pr-10 rounded-[9px] sm:rounded-lg border border-neutral-800 bg-transparent text-[13px] sm:text-sm text-white placeholder-neutral-500/80 outline-none transition focus:border-neutral-500"
                  />

                  <button
                    type="button"
                    id="toggleSignupPassword"
                    aria-label="Show password"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-500 hover:text-neutral-300"
                  >
                    <i data-lucide="eye" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>

              <!-- Confirm Password -->
              <div>
                <label
                  for="signupConfirmPassword"
                  class="block mb-1.5 text-[12px] sm:text-[13px] lg:text-[14px] font-medium text-white"
                >
                  Confirm password
                </label>

                <div class="relative">
                  <input
                    type="password"
                    id="signupConfirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm password"
                    autocomplete="new-password"
                    class="w-full h-10 sm:h-9 pl-3 pr-10 rounded-[9px] sm:rounded-lg border border-neutral-800 bg-transparent text-[13px] sm:text-sm text-white placeholder-neutral-500/80 outline-none transition focus:border-neutral-500"
                  />

                  <button
                    type="button"
                    id="toggleSignupConfirmPassword"
                    aria-label="Show password"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-500 hover:text-neutral-300"
                  >
                    <i data-lucide="eye" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>
            </div>

            <!-- Terms -->
            <label
              class="flex items-start gap-2 text-[10px] sm:text-xs leading-[1.4] text-white/50 cursor-pointer pt-0.5"
            >
              <input
                type="checkbox"
                id="signupTerms"
                name="terms"
                class="mt-0.5 w-3.5 h-3.5 shrink-0 accent-white"
              />

              <span>
                I agree to the
                <a href="#" class="text-white hover:underline">
                  Terms of Service
                </a>
                and
                <a href="#" class="text-white hover:underline">
                  Privacy Policy </a
                >.
              </span>
            </label>

            <!-- Message -->
            <div
              id="signupMessage"
              class="hidden rounded-[9px] border border-[#292929] bg-[#151515] px-3 py-2 text-[11px]"
              role="alert"
            ></div>

            <!-- Create Account -->
            <button
              type="submit"
              id="signupSubmit"
              class="w-full h-10 sm:h-9 rounded-[9px] sm:rounded-lg bg-white text-black text-[13px] sm:text-sm font-medium hover:bg-neutral-200 transition"
            >
              <span id="signupSubmitText"> Create account </span>

              <span id="signupSubmitLoading" class="hidden">
                Creating account...
              </span>
            </button>
          </form>

          <!-- Divider -->
          <div class="flex items-center gap-3 my-5 sm:my-6">
            <div class="h-px flex-1 bg-neutral-800"></div>

            <span
              class="text-[10px] sm:text-xs text-white/50 whitespace-nowrap"
            >
              Or continue with
            </span>

            <div class="h-px flex-1 bg-neutral-800"></div>
          </div>

          <!-- Social Buttons -->
          <div class="grid grid-cols-3 gap-2">
            <button
              type="button"
              id="googleSignupBtn"
              class="h-9 sm:h-8 flex items-center justify-center gap-1.5 sm:gap-2 bg-[#151515] rounded-[9px] border border-neutral-800 text-[11px] sm:text-sm font-medium hover:bg-neutral-900 transition"
            >
              <img
                src="sign-login-icons/google.svg"
                alt="Google"
                class="w-3.5 h-3.5 sm:w-4 sm:h-4"
              />
              <span class="hidden sm:inline">Google</span>
            </button>

            <button
              type="button"
              id="appleSignupBtn"
              class="h-9 sm:h-8 flex items-center justify-center gap-1.5 sm:gap-2 bg-[#151515] rounded-[9px] border border-neutral-800 text-[11px] sm:text-sm font-medium hover:bg-neutral-900 transition"
            >
              <img
                src="sign-login-icons/apple.svg"
                alt="Apple"
                class="w-3.5 h-3.5 sm:w-4 sm:h-4"
              />
              <span class="hidden sm:inline">Apple</span>
            </button>

            <button
              type="button"
              id="githubSignupBtn"
              class="h-9 sm:h-8 flex items-center justify-center gap-1.5 sm:gap-2 bg-[#151515] rounded-[9px] border border-neutral-800 text-[11px] sm:text-sm font-medium hover:bg-neutral-900 transition"
            >
              <img
                src="sign-login-icons/github.png"
                alt="GitHub"
                class="w-3.5 h-3.5 sm:w-4 sm:h-4"
              />
              <span class="hidden sm:inline">GitHub</span>
            </button>
          </div>

          <!-- Login -->
          <p
            class="text-center text-[11px] sm:text-sm text-neutral-400 mt-6 sm:mt-8"
          >
            Already have an account?

            <a
              href="signin.html"
              class="text-white font-medium hover:underline underline-offset-4"
            >
              Sign in
            </a>
          </p>

          <!-- Mobile Footer -->
          <p
            class="lg:hidden text-center mt-8 pb-2 px-2 text-[9px] leading-4 text-white/40"
          >
            By creating an account, you agree to laps'
            <a href="#" class="text-white hover:underline">
              Terms of Service
            </a>
            and
            <a href="#" class="text-white hover:underline"> Privacy Policy </a>.
          </p>
        </div>

        <!-- Desktop Footer -->
        <p
          class="hidden lg:block absolute bottom-6 left-0 right-0 px-6 text-center text-[11px] text-white/50"
        >
          By creating an account, you agree to laps'
          <a href="#" class="text-white hover:underline"> Terms of Service </a>
          and
          <a href="#" class="text-white hover:underline"> Privacy Policy </a>.
        </p>
      </section>

      <!-- RIGHT: IMAGE -->

      <section
        class="hidden lg:flex lg:w-[42%] min-h-screen relative overflow-hidden bg-grid p-8 xl:p-10 items-center justify-center"
      >
        <div
          class="relative z-10 h-[calc(100vh-80px)] max-h-[850px] aspect-[3/4] max-w-full"
        >
          <img
            src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=85&w=1600&auto=format&fit=crop"
            alt="Team working together"
            class="w-full h-full object-cover rounded-2xl border border-neutral-800/80 shadow-2xl"
          />
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
      lucide.createIcons();
    </script>
    <script src="/js/page-transition.js"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>

    <script>
      document
        .getElementById("signupForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const name = document.getElementById("signupName").value.trim();

          const email = document.getElementById("signupEmail").value.trim();

          const password = document.getElementById("signupPassword").value;

          const confirmPassword = document.getElementById(
            "signupConfirmPassword",
          ).value;

          const message = document.getElementById("signupMessage");

          const button = document.getElementById("signupSubmit");

          // Password validation
          if (password !== confirmPassword) {
            message.textContent = "Passwords do not match.";
            message.classList.remove("hidden");
            return;
          }

          button.disabled = true;
          button.classList.add("opacity-60");

          try {
            const data = await authRequest({
              action: "signup",
              name,
              email,
              password,
            });

            message.textContent = data.message;
            message.classList.remove("hidden");

            document.getElementById("signupForm").reset();
          } catch (error) {
            message.textContent = error.message;
            message.classList.remove("hidden");
          } finally {
            button.disabled = false;
            button.classList.remove("opacity-60");
          }
        });
    </script>
  </body>
</html>

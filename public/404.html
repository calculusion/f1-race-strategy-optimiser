<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>End of Lap</title>

    <!-- Favicon -->

    <!-- PNG Favicons -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="favicon/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicon/favicon-32x32.png"
    />

    <!-- Apple -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicon/apple-touch-icon.png"
    />

    <!-- Android -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="favicon/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="favicon/android-chrome-512x512.png"
    />

    <!-- Web App Manifest -->
    <link rel="manifest" href="favicon/site.webmanifest" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#09090b" />
    <meta name="msapplication-TileColor" content="#09090b" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="https://unpkg.com/reicon@latest/cdn/reicon.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Inter:wght@300;400;500;600&amp;family=Space+Grotesk:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />

    <style>
      /* Custom Scrollbar for premium feel */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* Custom Range Slider */
      input[type="range"] {
        -webkit-appearance: none;
        background: transparent;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 12px;
        width: 12px;
        border-radius: 50%;
        background: #ffffff;
        cursor: pointer;
        margin-top: -4px;
        box-shadow: 0 0 0 2px #09090b;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
      }

      @keyframes setupFadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .setup-animate-fade {
        animation: setupFadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
      }

      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @keyframes fadeUpIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-fade-up {
        animation: fadeUpIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      /* Checkbox Customization */
      .custom-checkbox input:checked + div {
        background-color: #6c5ce7;
        border-color: #6c5ce7;
      }
      .custom-checkbox input:checked + div svg {
        opacity: 1;
      }

      #mouseGlow {
        position: fixed;
        width: 420px;
        height: 420px;
        pointer-events: none;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(79, 140, 255, 0.1) 0%,
          rgba(79, 140, 255, 0.04) 35%,
          transparent 75%
        );
        filter: blur(70px);
        transform: translate(-50%, -50%);
        z-index: 50;
        mix-blend-mode: screen;
        opacity: 0.8;
        transition:
          left 0.08s ease,
          top 0.08s ease;
      }
    </style>
  </head>
  <body
    class="min-h-screen flex flex-col bg-[#09090b] text-slate-200 font-sans antialiased"

    <canvas
      id="gradient"
      class="fixed inset-0 w-full h-full z-0 pointer-events-none"
    ></canvas>
    <!-- Navigation -->
    <header

        <img
          src="/branding/lapslogobig.png"

          class="h-5 w-auto object-contain"
        />
      </div>

      <!-- Right Actions -->
      <div class="hidden md:flex items-center gap-2">
        <!-- Better Stack -->
        <a
          href="https://savepointgg.betteruptime.com/"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-2 h-9 px-4 rounded-full bg-[#151517]/50 backdrop-blur-xl border border-white/5 text-[13px] font-regular text-zinc-300 hover:text-white hover:bg-[#1b1b1e] transition-all duration-200"
        >
          <img
            src="website-icons/betterstack-dark.svg"
            alt="BetterStack"
            width="16"
            height="16"
          />
        </a>

        <!-- Behance -->
        <a

          rel="noopener noreferrer"
          class="inline-flex items-center gap-2 h-9 px-4 rounded-full bg-[#151517]/50 backdrop-blur-xl border border-white/5 text-[13px] font-regular text-zinc-300 hover:text-white hover:bg-[#1b1b1e] transition-all duration-200"
        >

        <!-- GitHub -->
        <a

          class="inline-flex items-center gap-2 h-9 px-4 rounded-full bg-[#151517]/50 backdrop-blur-xl border border-white/5 text-[13px] font-regular text-zinc-300 hover:text-white hover:bg-[#1b1b1e] transition-all duration-200"
        >
          <img
            src="sign-login-icons/github.png"
            alt="GitHub"
            width="16"
            height="16"
          />

        <!-- FastF1 Library -->
        <a

          rel="noopener noreferrer"
          class="inline-flex items-center gap-2 h-9 px-4 rounded-full bg-white text-[13px] font-medium text-[#09090b] hover:bg-zinc-200 transition-all duration-200"

        </a>
      </div>

      <!-- Mobile -->
      <div class="flex md:hidden items-center gap-1.5">
        <!-- Better Stack -->
        <a
          href="https://savepointgg.betteruptime.com/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Better Stack"
          class="w-9 h-9 flex items-center justify-center rounded-full bg-[#151517]/50 backdrop-blur-xl border border-white/5 hover:bg-[#1b1b1e] transition-all duration-200"
        >
          <img
            src="website-icons/betterstack-dark.svg"
            alt=""
            width="16"
            height="16"
          />
        </a>

        <!-- Discord -->
        <a
          href="https://discord.gg/JGRU4a9GDd"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Discord"
          class="w-9 h-9 flex items-center justify-center rounded-full bg-[#151517]/50 backdrop-blur-xl border border-white/5 hover:bg-[#1b1b1e] transition-all duration-200"
        >
          <img
            src="https://cdn.reicon.dev/logos/discord/original.svg"
            alt=""
            width="16"
            height="16"
          />
        </a>

        <!-- GitHub -->
        <a
          href="https://github.com/calculusion/continue-game-project"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub"
          class="w-9 h-9 flex items-center justify-center rounded-full bg-[#151517]/50 backdrop-blur-xl border border-white/5 hover:bg-[#1b1b1e] transition-all duration-200"
        >

            alt=""

          />
        </a>

        <!-- SteamDB -->
        <a

      </div>
    </header>

    <!-- Main Content -->
    <main
      class="flex-1 min-h-0 relative z-10 grid grid-rows-[1fr_auto] overflow-y-auto"
    >
      <div
        class="h-full flex flex-col items-center justify-center px-3 md:px-6 pb-20 md:pb-24"
      >
        <!-- Hero Text -->
        <div class="text-center max-w-4xl mx-auto space-y-6">

            class="text-[30px] md:text-7xl font-serif text-white tracking-tight leading-[1.08] md:leading-[1] font-normal"
          >
            Page Not Found
          </h1>
          <p
            class="text-[13px] md:text-[17px] leading-4 md:leading-normal text-zinc-100 max-w-[330px] md:max-w-2xl mx-auto font-regular"
          >
            You just hit a dead end.
          </p>
        </div>

        <div class="flex justify-center mt-7 md:mt-8 w-full">
          <button
            onclick="window.location.href = '/'"
            class="flex justify-center items-center gap-2 bg-white text-[#09090b] hover:bg-gray-200 rounded-full px-3 py-2.5 md:px-5 md:py-3 text-[12px] md:text-[14px] font-medium transition-colors"
          >
            Go back to Home
          </button>
        </div>
      </div>
      <footer class="w-full flex justify-center py-5 md:py-4">
        <p class="text-[10px] md:text-[11px] tracking-wide text-white">
          © 2026 <span class="text-zinc-500">F1 by Laps</span>. All rights
          reserved.
        </p>
      </footer>
    </main>

    <script>
      // Initialize Lucide icons
      lucide.createIcons();
    </script>

    <script type="module">
      import { NeatGradient } from "https://cdn.jsdelivr.net/npm/@firecms/neat/+esm";

      const config = {
        colors: [
          {
            color: "#09090B",
            enabled: true,
          },
          {
            color: "#180709",
            enabled: true,
          },
          {
            color: "#2A080B",
            enabled: true,
          },
          {
            color: "#400B0F",
            enabled: true,
          },
          {
            color: "#5A1014",
            enabled: true,
          },
        ],

        speed: 4,
        horizontalPressure: 4,
        verticalPressure: 3,
        waveFrequencyX: 0,
        waveFrequencyY: 0,
        waveAmplitude: 0,
        secondaryWaveEnabled: false,
        secondaryWaveFrequencyX: 3,
        secondaryWaveFrequencyY: 3,
        secondaryWaveAmplitude: 5,
        secondaryWaveSpeed: 0.6,
        secondaryWaveAngle: 1,
        shadows: 2,
        highlights: 7,
        colorBrightness: 1,
        colorSaturation: 8,
        wireframe: false,
        antialias: false,
        colorBlending: 5,
        backgroundColor: "#FF0000",
        backgroundAlpha: 1,
        grainScale: 0,
        grainSparsity: 0,
        grainIntensity: 0,
        grainSpeed: 0,
        resolution: 0.5,
        yOffset: 0,
        yOffsetWaveMultiplier: 1.5,
        yOffsetColorMultiplier: 1.8,
        yOffsetFlowMultiplier: 2,
        flowDistortionA: 0,
        flowDistortionB: 0,
        flowScale: 1,
        flowEase: 0,
        flowEnabled: false,
        enableProceduralTexture: false,
        transparentTextureVoid: false,
        textureMode: "bitmap",
        bakeEdgeSoftness: 1,
        textureVoidLikelihood: 0.45,
        textureVoidWidthMin: 200,
        textureVoidWidthMax: 486,
        textureBandDensity: 2.15,
        textureColorBlending: 0.01,
        textureSeed: 333,
        textureEase: 0.75,
        proceduralBackgroundColor: "#<n>000000</n>",
        textureShapeTriangles: 20,
        textureShapeCircles: 15,
        textureShapeBars: 15,
        textureShapeSquiggles: 10,
        domainWarpEnabled: false,
        domainWarpIntensity: 0,
        domainWarpScale: 3,
        vignetteIntensity: 0,
        vignetteRadius: 0.8,
        fresnelEnabled: false,
        fresnelPower: 2,
        fresnelIntensity: 0.5,
        fresnelColor: "#FFFFFF",
        iridescenceEnabled: false,

        prismEdgeEnabled: false,
        prismEdgeIntensity: 0.5,

        prismEdgeSpread: 1,

        prismEdgeRipple: 1,
        bloomIntensity: 0,
        bloomThreshold: 0.7,
        chromaticAberration: 0,
        shapeType: "plane",
        shapeRotationX: 0,
        shapeRotationY: 0,
        shapeRotationZ: 0,
        shapeAutoRotateSpeedX: 0,
        shapeAutoRotateSpeedY: 0,
        sphereRadius: 15,
        torusRadius: 15,
        torusTube: 5,
        cylinderRadius: 10,
        cylinderHeight: 40,
        planeBend: 0,

        silhouetteFade: 0.25,
        cylinderFade: 0.08,

        flatShading: true,
        cameraLock: true,
        cameraX: 0,
        cameraY: 0,
        cameraZ: 0,
        cameraRotationX: 0,
        cameraRotationY: 0,
        cameraRotationZ: 0,
        cameraZoom: 1,
      };

      const gradient = new NeatGradient({
        ref: document.getElementById("gradient"),
        ...config,
      });

      // Optional: react to scroll
      window.addEventListener("scroll", () => {
        gradient.yOffset = window.scrollY;
      });
    </script>
  </body>
</html>

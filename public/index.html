      /* Custom Scrollbar for premium feel */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* Custom Range Slider */
      input[type="range"] {
        -webkit-appearance: none;
        background: transparent;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 12px;
        width: 12px;
        border-radius: 50%;
        background: #ffffff;
        cursor: pointer;
        margin-top: -4px;
        box-shadow: 0 0 0 2px #09090b;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
      }

      @keyframes setupFadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .setup-animate-fade {
        animation: setupFadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
      }

      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @keyframes fadeUpIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-fade-up {
        animation: fadeUpIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      /* Checkbox Customization */
      .custom-checkbox input:checked + div {
        background-color: #6c5ce7;
        border-color: #6c5ce7;
      }
      .custom-checkbox input:checked + div svg {
        opacity: 1;
      }

      #mouseGlow {
        position: fixed;
        width: 420px;
        height: 420px;
        pointer-events: none;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(79, 140, 255, 0.1) 0%,
          rgba(79, 140, 255, 0.04) 35%,
          transparent 75%
        );
        filter: blur(70px);
        transform: translate(-50%, -50%);
        z-index: 50;
        mix-blend-mode: screen;
        opacity: 0.8;
        transition:
          left 0.08s ease,
          top 0.08s ease;
      }

      import { NeatGradient } from "https://cdn.jsdelivr.net/npm/@firecms/neat/+esm";

      const config = {
        colors: [

            color: "#09090B",

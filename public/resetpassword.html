<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Laps | Reset Password</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />

    <!-- PNG Favicons -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-32x32.png"
    />

    <!-- Apple -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />

    <!-- Android -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/favicon/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/favicon/android-chrome-512x512.png"
    />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ReIcon -->
    <script src="https://unpkg.com/reicon@latest/cdn/reicon.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        background: #050505;
      }

      body {
        font-family: "Inter", sans-serif;
      }

      .bg-grid {
        background-size: 32px 32px;
        background-image:
          linear-gradient(
            to right,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px
          );
      }
    </style>

    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      body::-webkit-scrollbar {
        display: none;
      }
      #toggleSignupPassword,
      #toggleSignupConfirmPassword,
      #toggleSigninPassword,
      #toggleResetPassword,
      #toggleResetConfirmPassword,
      #toggleSignupPassword svg,
      #toggleSignupConfirmPassword svg,
      #toggleSigninPassword svg,
      #toggleResetPassword svg,
      #toggleResetConfirmPassword svg {
        transition: none !important;
        animation: none !important;
      }
    </style>
  </head>

  <body class="min-h-screen bg-[#050505] text-white">
    <!-- Page transition -->
    <div
      id="pageTransition"
      class="fixed inset-0 z-[99999] flex items-center justify-center bg-[#09090b] opacity-0 pointer-events-none transition-opacity duration-700 ease-out"
    >
      <div
        id="pageTransitionText"
        class="text-[11px] uppercase tracking-[0.25em] text-white/40"
      >
        Loading...
      </div>
    </div>

    <!-- Main -->
    <main
      id="pageContent"
      class="h-screen overflow-hidden flex flex-col lg:flex-row opacity-0 translate-y-2 transition-all duration-700 ease-out"
    >
      <!-- LEFT -->
      <section
        class="relative w-full lg:w-[58%] min-h-screen flex items-center justify-center px-5 py-8 sm:px-8 lg:px-10 overflow-y-auto lg:overflow-hidden"
      >
        <!-- Form -->
        <div class="w-full max-w-[360px] mt-2 sm:mt-4 pb-16 lg:pb-0">
          <!-- Center Logo -->
          <div class="flex justify-center mb-5 sm:mb-6">
            <img
              src="/branding/lapslogobig.png"
              alt="Laps"
              class="h-6 sm:h-7 w-auto object-contain"
            />
          </div>

          <!-- Heading -->
          <div class="mb-5 sm:mb-6">
            <h1
              class="text-[20px] sm:text-[21px] lg:text-[22px] text-white font-semibold tracking-tight text-center"
            >
              Create a new password.
            </h1>

            <p
              class="text-[11px] sm:text-xs text-white/50 text-center mt-1.5 sm:mt-2"
            >
              Enter your new password below.
            </p>
          </div>

          <!-- Reset Form -->
          <form id="resetPasswordForm" class="space-y-3.5 sm:space-y-4">
            <!-- New Password -->
            <div>
              <label
                for="resetPassword"
                class="block mb-1.5 text-[12px] sm:text-[13px] lg:text-[14px] font-medium text-white"
              >
                New password
              </label>

              <div class="relative">
                <input
                  type="password"
                  id="resetPassword"
                  name="password"
                  autocomplete="new-password"
                  placeholder="Enter new password"
                  class="w-full h-10 sm:h-9 pl-3 pr-10 rounded-[9px] sm:rounded-lg border border-neutral-800 bg-transparent text-[13px] sm:text-sm text-white placeholder-neutral-500/80 outline-none transition focus:border-neutral-500"
                  required
                />

                <button
                  type="button"
                  id="toggleResetPassword"
                  aria-label="Show password"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-500 hover:text-neutral-300"
                >
                  <i data-lucide="eye" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <!-- Confirm Password -->
            <div>
              <label
                for="resetConfirmPassword"
                class="block mb-1.5 text-[12px] sm:text-[13px] lg:text-[14px] font-medium text-white"
              >
                Confirm password
              </label>

              <div class="relative">
                <input
                  type="password"
                  id="resetConfirmPassword"
                  name="confirmPassword"
                  autocomplete="new-password"
                  placeholder="Confirm new password"
                  class="w-full h-10 sm:h-9 pl-3 pr-10 rounded-[9px] sm:rounded-lg border border-neutral-800 bg-transparent text-[13px] sm:text-sm text-white placeholder-neutral-500/80 outline-none transition focus:border-neutral-500"
                  required
                />

                <button
                  type="button"
                  id="toggleResetConfirmPassword"
                  aria-label="Show password"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-500 hover:text-neutral-300"
                >
                  <i data-lucide="eye" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <!-- Message -->
            <div
              id="resetPasswordMessage"
              class="hidden rounded-[9px] border px-3 py-2 text-[11px] leading-4"
              role="alert"
            ></div>

            <!-- Submit -->
            <button
              type="submit"
              id="resetPasswordSubmit"
              class="w-full h-10 sm:h-9 rounded-[9px] sm:rounded-lg bg-white text-black text-[13px] sm:text-sm font-medium hover:bg-neutral-200 transition disabled:opacity-50 disabled:cursor-not-allowed"
            >
              <span id="resetPasswordSubmitText"> Update password </span>

              <span id="resetPasswordSubmitLoading" class="hidden">
                Updating...
              </span>
            </button>
          </form>

          <!-- Back to Sign In -->
          <div class="mt-5 sm:mt-6 text-center">
            <a
              href="signin.html"
              class="inline-flex items-center gap-1.5 text-[11px] sm:text-xs text-white/50 hover:text-white transition"
            >
              <re-icon
                icon="square-arrow-left"
                weight="filled"
                class="w-3.5 h-3.5 sm:w-4 sm:h-4"
              ></re-icon>

              Back to sign in
            </a>
          </div>

          <!-- Mobile Footer -->
          <p
            class="lg:hidden text-center mt-8 pb-2 px-2 text-[9px] leading-4 text-white/40"
          >
            By creating an account, you agree to laps'
            <a href="#" class="text-white hover:underline">
              Terms of Service
            </a>
            and
            <a href="#" class="text-white hover:underline"> Privacy Policy </a>.
          </p>
        </div>

        <!-- Desktop Footer -->
        <p
          class="hidden lg:block absolute bottom-6 left-0 right-0 px-6 text-center text-[11px] text-white/50"
        >
          By creating an account, you agree to laps'
          <a href="#" class="text-white hover:underline"> Terms of Service </a>
          and
          <a href="#" class="text-white hover:underline"> Privacy Policy </a>.
        </p>
      </section>

      <!-- RIGHT -->
      <section
        class="hidden lg:flex lg:w-[42%] min-h-screen relative overflow-hidden bg-grid p-8 xl:p-10 items-center justify-center"
      >
        <div
          class="relative z-10 h-[calc(100vh-80px)] max-h-[850px] aspect-[3/4] max-w-full"
        >
          <img
            src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=85&w=1600&auto=format&fit=crop"
            alt="Team working together"
            class="w-full h-full object-cover rounded-2xl border border-neutral-800/80 shadow-2xl"
          />
        </div>
      </section>
    </main>

    <!-- Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
      lucide.createIcons();
    </script>
    <script src="/js/page-transition.js"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>

    <script>
      const form = document.getElementById("resetPasswordForm");

      const passwordInput = document.getElementById("resetPassword");

      const confirmPasswordInput = document.getElementById(
        "resetConfirmPassword",
      );

      const message = document.getElementById("resetPasswordMessage");

      const submitButton = document.getElementById("resetPasswordSubmit");

      const submitText = document.getElementById("resetPasswordSubmitText");

      const submitLoading = document.getElementById(
        "resetPasswordSubmitLoading",
      );

      function showMessage(text, type = "error") {
        message.textContent = text;

        message.classList.remove(
          "hidden",
          "border-red-900",
          "bg-red-950/30",
          "text-red-400",
          "border-[#292929]",
          "bg-[#151515]",
          "text-[#B6B6B6]",
          "border-green-900",
          "bg-green-950/30",
          "text-green-400",
        );

        if (type === "success") {
          message.classList.add(
            "border-green-900",
            "bg-green-950/30",
            "text-green-400",
          );
        } else {
          message.classList.add(
            "border-red-900",
            "bg-red-950/30",
            "text-red-400",
          );
        }
      }

      // ==========================================
      // RESET PASSWORD
      // ==========================================

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const password = passwordInput.value;

        const confirmPassword = confirmPasswordInput.value;

        // Password match
        if (password !== confirmPassword) {
          showMessage("Passwords do not match.");

          return;
        }

        // Minimum password length
        if (password.length < 6) {
          showMessage("Password must be at least 6 characters.");

          return;
        }

        submitButton.disabled = true;

        submitText.classList.add("hidden");
        submitLoading.classList.remove("hidden");

        message.classList.add("hidden");

        try {
          const { data, error } = await supabaseClient.auth.updateUser({
            password: password,
          });

          if (error) {
            throw error;
          }

          showMessage(
            "Your password has been updated successfully.",
            "success",
          );

          form.reset();

          // Give user time to see success message
          setTimeout(() => {
            window.location.href = "signin.html";
          }, 1800);
        } catch (error) {
          console.error("Password reset error:", error);

          showMessage(
            error.message ||
              "Unable to update your password. Please request a new reset link.",
          );
        } finally {
          submitButton.disabled = false;

          submitText.classList.remove("hidden");
          submitLoading.classList.add("hidden");
        }
      });
    </script>
  </body>
</html>

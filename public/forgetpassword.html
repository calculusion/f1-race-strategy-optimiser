<!doctype html>

<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Laps | Forgot Password</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/reicon@latest/cdn/reicon.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        background: #050505;
      }
      body {
        font-family: "Inter", sans-serif;
      }

      .bg-grid {
        background-size: 32px 32px;

        background-image:
          linear-gradient(
            to right,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px
          );
      }
    </style>
    <style>
      /* Hide scrollbar, keep scrolling */
      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      body::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>

  <body class="h-screen overflow-hidden bg-[#050505] text-white">
    <div
      id="pageTransition"
      class="fixed inset-0 z-[99999] flex items-center justify-center bg-[#050505] opacity-0 pointer-events-none transition-opacity duration-700 ease-out"
    >
      <div
        id="pageTransitionText"
        class="text-[11px] uppercase tracking-[0.25em] text-white/40"
      >
        Loading...
      </div>
    </div>
    <main
      id="pageContent"
      class="min-h-screen flex flex-col lg:flex-row opacity-0 translate-y-2 transition-all duration-700 ease-out"
    >
      <!-- LEFT: FORGOT PASSWORD -->

      <section
        class="relative w-full lg:w-[58%] min-h-screen flex items-center justify-center px-6 py-10 sm:px-10"
      >
        <!-- Logo -->
        <div class="absolute top-8 left-6 sm:left-10 flex items-center gap-2">
          <a href="index.html" aria-label="Go to sign in">
            <img
              src="/branding/lapslogobig.png"
              alt="Logo"
              class="h-6 object-contain cursor-pointer"
            />
          </a>
        </div>

        <!-- Forgot Password Form -->

        <div class="w-full max-w-[360px] mt-4">
          <!-- Heading -->

          <div class="mb-6">
            <h1
              class="text-[22px] sm:text-[20px] text-[#FFFFFF] font-semibold tracking-tight text-center"
            >
              Forgot your password?
            </h1>

            <p class="text-xs leading-5 text-[#FFFFFF]/50 text-center mt-2">
              Enter your email address and we'll send the magic link.
            </p>
          </div>

          <!-- Forgot Password Form -->
          <form id="forgotPasswordForm" class="space-y-4">
            <!-- Email -->
            <div>
              <label
                for="forgotPasswordEmail"
                class="block mb-2 text-[14px] font-medium text-[#FFFFFF]"
              >
                Email
              </label>

              <input
                type="email"
                id="forgotPasswordEmail"
                name="email"
                placeholder="johndoe@email.com"
                autocomplete="email"
                class="w-full h-9 px-3 rounded-lg border border-neutral-800 bg-transparent text-sm text-[#FFFFFF] placeholder-neutral-500/80 outline-none transition focus:border-neutral-500"
              />
            </div>

            <!-- Message -->
            <div
              id="forgotPasswordMessage"
              class="hidden rounded-lg border border-[#292929] bg-[#151515] px-3 py-2 text-[11px]"
              role="alert"
            ></div>

            <!-- Send Reset Link -->
            <button
              type="submit"
              id="forgotPasswordSubmit"
              class="w-full h-9 rounded-lg bg-white text-black text-sm font-medium hover:bg-neutral-200 transition"
            >
              <span id="forgotPasswordSubmitText"> Send reset link </span>

              <span id="forgotPasswordSubmitLoading" class="hidden">
                Sending...
              </span>
            </button>
          </form>

          <!-- Back to Sign In -->

          <div class="flex justify-center mt-7">
            <a
              href="signin.html"
              class="flex items-center gap-2 text-sm text-neutral-400 hover:text-white transition"
            >
              <re-icon
                icon="square-arrow-left"
                weight="filled"
                class="w-4 h-4"
              ></re-icon>

              Back to sign in
            </a>
          </div>
        </div>

        <!-- Footer -->

        <p
          class="absolute bottom-6 left-0 right-0 px-6 text-center text-[11px] text-[#FFFFFF]/50"
        >
          By continuing, you agree to laps'

          <a href="#" class="text-[#FFFFFF] hover:underline">
            Terms of Service
          </a>

          and

          <a href="#" class="text-[#FFFFFF] hover:underline"> Privacy Policy </a
          >.
        </p>
      </section>

      <!-- RIGHT: IMAGE -->

      <section
        class="hidden lg:flex lg:w-[42%] min-h-screen relative overflow-hidden bg-grid p-8 xl:p-10 items-center justify-center"
      >
        <div
          class="relative z-10 w-full h-full max-w-[680px] flex items-center justify-center"
        >
          <img
            src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=85&w=1600&auto=format&fit=crop"
            alt="Team working together"
            class="w-full h-[calc(100vh-80px)] max-h-[850px] object-cover rounded-2xl border border-neutral-800/80 shadow-2xl"
          />
        </div>
      </section>
    </main>

    <script src="/js/page-transition.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>

    <script>
      lucide.createIcons();
    </script>
    <script src="/js/auth.js"></script>

    <script>
      // ==========================================
      // FORGOT PASSWORD
      // ==========================================

      document
        .getElementById("forgotPasswordForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document
            .getElementById("forgotPasswordEmail")
            .value.trim();

          const message = document.getElementById("forgotPasswordMessage");

          const button = document.getElementById("forgotPasswordSubmit");

          const buttonText = document.getElementById(
            "forgotPasswordSubmitText",
          );

          const buttonLoading = document.getElementById(
            "forgotPasswordSubmitLoading",
          );

          button.disabled = true;
          button.classList.add("opacity-60");

          buttonText.classList.add("hidden");
          buttonLoading.classList.remove("hidden");

          message.classList.add("hidden");

          try {
            const data = await authRequest({
              action: "forgot-password",
              email,
            });

            message.textContent = data.message;

            message.classList.remove("hidden");

            message.classList.remove(
              "border-red-900",
              "bg-red-950/30",
              "text-red-400",
            );

            message.classList.add(
              "border-green-900",
              "bg-green-950/30",
              "text-green-400",
            );
          } catch (error) {
            message.textContent = error.message || "Unable to send reset link.";

            message.classList.remove("hidden");

            message.classList.remove(
              "border-green-900",
              "bg-green-950/30",
              "text-green-400",
            );

            message.classList.add(
              "border-red-900",
              "bg-red-950/30",
              "text-red-400",
            );
          } finally {
            button.disabled = false;
            button.classList.remove("opacity-60");

            buttonText.classList.remove("hidden");
            buttonLoading.classList.add("hidden");
          }
        });
    </script>
  </body>
</html>

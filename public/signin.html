<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReUI Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/reicon@latest/cdn/reicon.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        background: #111113;
      }
      body {
        font-family: "Inter", sans-serif;
        background: #050505;
      }

      .bg-grid {
        background-size: 32px 32px;
        background-image:
          linear-gradient(
            to right,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px
          );
      }
    </style>
    <style>
      /* Hide scrollbar, keep scrolling */
      ::-webkit-scrollbar {
        display: none;
      }

      html {
        scrollbar-width: none;
      }

      body {
        -ms-overflow-style: none;
      }
    </style>
  </head>

  <body class="min-h-screen bg-[#050505] text-white">
    <main class="min-h-screen flex flex-col lg:flex-row">
      <!-- LEFT: LOGIN -->
      <section
        class="relative w-full lg:w-[58%] min-h-screen flex items-center justify-center px-6 py-10 sm:px-10"
      >
        <!-- Logo -->
        <div class="absolute top-8 left-6 sm:left-10 flex items-center gap-2">
          <div
            class="w-8 h-8 rounded-lg bg-white text-black flex items-center justify-center font-semibold"
          >
            U
          </div>
          <span class="text-base font-semibold">ReUI</span>
        </div>

        <!-- Compact login card -->
        <div class="w-full max-w-[360px] mt-4">
          <div class="mb-5">
            <h1
              class="text-[22px] sm:text-[20px] text-[#FFFFFF] font-semibold tracking-tight text-center"
            >
              Log in to your ReUI account.
            </h1>
          </div>

          <form class="space-y-4">
            <!-- Email -->
            <div>
              <label
                for="email"
                class="block mb-2 text-[14px] font-medium text-[#FFFFFF]"
              >
                Email
              </label>
              <input
                type="text"
                id="email"
                placeholder="johndoe@email.com"
                class="w-full h-9 px-3 rounded-lg border border-neutral-800 bg-transparent text-sm text-[#FFFFFF] placeholder-neutral-500/80 outline-none transition focus:border-neutral-500"
              />
            </div>

            <!-- Password -->
            <div>
              <div class="flex items-center justify-between mb-2">
                <label
                  for="password"
                  class="text-[14px] font-medium text-[#FFFFFF]"
                >
                  Password
                </label>
                <a
                  href="forgetpassword.html"
                  class="text-xs text-neutral-400 hover:text-white transition"
                >
                  Forgot password?
                </a>
              </div>

              <div class="relative">
                <input
                  type="password"
                  id="password"
                  placeholder="Enter password"
                  class="w-full h-9 pl-3 pr-10 rounded-lg border border-neutral-800 bg-transparent text-sm text-[#FFFFFF] placeholder-neutral-500/80 outline-none transition focus:border-neutral-500"
                />

                <button
                  type="button"
                  aria-label="Show password"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-500 hover:text-neutral-300"
                >
                  <i data-lucide="eye" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <!-- Sign in -->
            <button
              type="submit"
              class="w-full h-9 rounded-lg bg-white text-black text-sm font-medium hover:bg-neutral-200 transition"
            >
              Sign in
            </button>
          </form>

          <!-- Divider -->
          <div class="flex items-center gap-3 my-6">
            <div class="h-px flex-1 bg-neutral-800"></div>
            <span class="text-xs text-[#FFFFFF]/60 whitespace-nowrap">
              Or continue with
            </span>
            <div class="h-px flex-1 bg-neutral-800"></div>
          </div>

          <!-- Social buttons -->
          <div class="grid grid-cols-3 gap-2.5">
            <button
              class="h-8 flex items-center bg-[#151515] justify-center gap-2 rounded-[10px] border border-neutral-800 text-xs sm:text-sm font-medium hover:bg-neutral-900 transition"
            >
              <img
                src="sign-login-icons/google.svg"
                alt="Google"
                class="w-4 h-4"
              />
              <span class="hidden sm:inline">Google</span>
            </button>

            <button
              class="h-8 flex items-center bg-[#151515] justify-center gap-2 rounded-[10px] border border-neutral-800 text-xs sm:text-sm font-medium hover:bg-neutral-900 transition"
            >
              <img
                src="sign-login-icons/apple.svg"
                alt="Google"
                class="w-4 h-4"
              />
              <span class="hidden sm:inline">Apple</span>
            </button>

            <button
              class="h-8 flex items-center bg-[#151515] justify-center gap-2 rounded-[10px] border border-neutral-800 text-xs sm:text-sm font-medium hover:bg-neutral-900 transition"
            >
              <img
                src="sign-login-icons/github.png"
                alt="Google"
                class="w-4 h-4"
              />
              <span class="hidden sm:inline">GitHub</span>
            </button>
          </div>

          <!-- Sign up -->
          <p class="text-center text-sm text-neutral-400 mt-8">
            Need an account?
            <a
              href="signup.html"
              class="text-[#FFFFFF] font-medium hover:underline underline-offset-4"
            >
              Sign up
            </a>
          </p>
        </div>

        <!-- Terms -->
        <p
          class="absolute bottom-6 left-0 right-0 px-6 text-center text-[11px] text-[#FFFFFF]/50"
        >
          By continuing, you agree to ReUI's
          <a href="#" class="text-[#FFFFFF] hover:underline"
            >Terms of Service</a
          >
          and
          <a href="#" class="text-[#FFFFFF] hover:underline">Privacy Policy</a>.
        </p>
      </section>

      <!-- RIGHT: IMAGE -->
      <section
        class="hidden lg:flex lg:w-[42%] min-h-screen relative overflow-hidden bg-grid p-8 xl:p-10 items-center justify-center"
      >
        <div
          class="relative z-10 w-full h-full max-w-[680px] flex items-center justify-center"
        >
          <img
            src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=85&w=1600&auto=format&fit=crop"
            alt="Team working together"
            class="w-full h-[calc(100vh-80px)] max-h-[850px] object-cover rounded-2xl border border-neutral-800/80 shadow-2xl"
          />
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
    <script src="/js/page-transition.js"></script>
  </body>
</html>
